name: Frontend

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  frontend:
    name: Lint, test & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Committed bundle matches the sources
        working-directory: .
        run: |
          if [ -n "$(git status --porcelain -- custom_components/plant_garden/frontend)" ]; then
            git status --short -- custom_components/plant_garden/frontend
            echo "::error::The committed frontend bundle is outdated. Run 'npm run build' in frontend/ and commit the result."
            exit 1
          fi
