# Simulated irrigation hardware for the demo garden.
# Toggle these entities in the HA UI to test irrigation tracking without real valves.
input_boolean:
  demo_zone_lawn:
    name: Demo Regner Rasen
    icon: mdi:sprinkler
  demo_zone_bed_south:
    name: Demo Sprühdüsen Beet Süd
    icon: mdi:sprinkler-variant
  demo_zone_hedge:
    name: Demo Tropfschlauch Hecke
    icon: mdi:water-pump
  demo_zone_raised_bed_state:
    name: Demo Hochbeet (interner Zustand)
    icon: mdi:toggle-switch-variant

# A switch entity, because many irrigation integrations expose switches.
template:
  - switch:
      - name: Demo Ventil Hochbeet
        unique_id: plant_garden_demo_valve_raised_bed
        icon: mdi:valve
        state: "{{ is_state('input_boolean.demo_zone_raised_bed_state', 'on') }}"
        turn_on:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.demo_zone_raised_bed_state
        turn_off:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.demo_zone_raised_bed_state
  # Sensors to place as markers on the plan
  - sensor:
      - name: Demo Bodenfeuchte Beet
        unique_id: plant_garden_demo_soil_moisture
        unit_of_measurement: "%"
        device_class: moisture
        state_class: measurement
        state: "{{ (30 + (now().minute % 10)) }}"
      - name: Demo Zisterne
        unique_id: plant_garden_demo_cistern
        unit_of_measurement: "%"
        icon: mdi:storage-tank-outline
        state_class: measurement
        state: "72"

# A timer like real irrigation controllers use: the plan shows the remaining time.
timer:
  demo_zone_lawn:
    name: Demo Timer Rasen
    duration: "00:10:00"

automation:
  - id: plant_garden_demo_lawn_timer
    alias: Demo Regner Rasen startet Timer
    triggers:
      - trigger: state
        entity_id: input_boolean.demo_zone_lawn
        to: "on"
    actions:
      - action: timer.start
        target:
          entity_id: timer.demo_zone_lawn
  - id: plant_garden_demo_lawn_off
    alias: Demo Regner Rasen aus, wenn der Timer abläuft
    triggers:
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.demo_zone_lawn
    actions:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.demo_zone_lawn
