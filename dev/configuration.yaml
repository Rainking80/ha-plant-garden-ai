# Minimal Home Assistant configuration for developing Plant Garden.
# Used by scripts/develop (WSL/devcontainer) and docker-compose.yml.
homeassistant:
  name: Plant Garden Dev
  latitude: 52.52
  longitude: 13.40
  elevation: 34
  unit_system: metric
  currency: EUR
  country: DE
  language: de
  time_zone: Europe/Berlin
  packages:
    demo_garden: !include demo_garden.yaml

# Only what the panel and the demo need, to keep start-up fast.
frontend:
config:
history:
logbook:
recorder:
  purge_keep_days: 30

logger:
  default: warning
  logs:
    custom_components.plant_garden: debug
    homeassistant.components.http: info
