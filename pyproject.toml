[project]
name = "ha-plant-garden"
version = "0.1.0"
description = "Plant Garden – Home Assistant custom integration (garden planner, plant journal, water balance, AI assistant)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
  "pytest-homeassistant-custom-component==0.13.375",
  # must match the "requirements" of homeassistant/components/frontend/manifest.json
  # of the HA version pinned by the test plugin above
  "home-assistant-frontend==20260930.5",
  "ruff>=0.14",
  "mypy>=1.18",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning:pytest_asyncio.*"]

[tool.coverage.run]
source = ["custom_components/plant_garden"]
omit = ["custom_components/plant_garden/frontend/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["frontend", "custom_components/plant_garden/frontend"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "A", "ASYNC", "B", "C4", "DTZ", "E", "F", "FBT003", "G", "I", "ICN", "LOG", "N",
  "PERF", "PGH", "PIE", "PL", "PT", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T20",
  "TC", "TID", "UP", "W",
]
ignore = [
  "PLR0913", # HA callbacks have many params
  "PLR2004", # magic values are fine in tests/physics
  "S101",    # assert
  "TC001", "TC002", "TC003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "SLF001", "PLR0915"]
"scripts/**" = ["T201", "S"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.plant_garden"]
force-sort-within-sections = true
combine-as-imports = true

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.14"
files = ["custom_components/plant_garden"]
exclude = ["custom_components/plant_garden/frontend/"]
strict = true
warn_unreachable = true
disallow_any_generics = false
ignore_missing_imports = false

# Home Assistant re-exports many names via "import x  # noqa: F401" without __all__.
[[tool.mypy.overrides]]
module = ["homeassistant.*"]
implicit_reexport = true
