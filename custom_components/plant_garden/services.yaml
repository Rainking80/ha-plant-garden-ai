log_watering:
  fields:
    device_id:
      required: true
      selector:
        device:
          multiple: true
          filter:
            - integration: plant_garden
    liters:
      selector:
        number:
          min: 0.01
          max: 10000
          step: 0.1
          unit_of_measurement: L
          mode: box
    minutes:
      selector:
        number:
          min: 0.1
          max: 1440
          step: 0.5
          unit_of_measurement: min
          mode: box
    note:
      selector:
        text:

refresh_weather:

identify_plant:
  fields:
    device_id:
      required: true
      selector:
        device:
          filter:
            - integration: plant_garden
    photos:
      default: 3
      selector:
        number:
          min: 1
          max: 3
          mode: box
